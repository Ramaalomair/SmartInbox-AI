[project]
name = "smartinbox-ai"
version = "0.1.0"
description = "Agentic AI shared inbox with retrieval, access controls, and human-approved drafts."
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit",
    "python-dotenv",
    "openai",
    "pydantic>=2",
    "mcp>=1,<3",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "pytest",
]
